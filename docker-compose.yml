# ── Applivo SaaS Production Docker Compose ─────────────────
# Multi-container setup: API, PostgreSQL, Redis, Celery Worker, Celery Beat
# Usage: docker-compose up -d
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: applivo-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: applivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: applivo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applivo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Message Broker + Result Backend) ────────────
  redis:
    image: redis:7-alpine
    container_name: applivo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API Server ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applivo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - applivo-storage:/app/storage
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://applivo:${POSTGRES_PASSWORD:-changeme}@database:5432/applivo
      - DATABASE_URL_SYNC=postgresql://applivo:${POSTGRES_PASSWORD:-changeme}@database:5432/applivo
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Worker (Background Tasks) ──────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applivo-worker
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default,scraping,analysis,apply,notifications,email_monitor,priority"]
    volumes:
      - applivo-storage:/app/storage
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://applivo:${POSTGRES_PASSWORD:-changeme}@database:5432/applivo
      - DATABASE_URL_SYNC=postgresql://applivo:${POSTGRES_PASSWORD:-changeme}@database:5432/applivo
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Beat (Periodic Task Scheduler) ─────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applivo-scheduler
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/app/storage/celerybeat-schedule"]
    volumes:
      - applivo-storage:/app/storage
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://applivo:${POSTGRES_PASSWORD:-changeme}@database:5432/applivo
      - DATABASE_URL_SYNC=postgresql://applivo:${POSTGRES_PASSWORD:-changeme}@database:5432/applivo
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Celery Flower (Task Monitoring UI) ────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applivo-flower
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.celery_app:celery_app", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  applivo-storage:
    driver: local
